name: app12
description: "Flutter app with Firebase and Raspberry Pi face recognition"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_auth: ^6.1.2
  
  # ADD THESE for face recognition:
  http: ^1.1.0            # For API calls to Raspberry Pi
  camera: ^0.11.3         # Camera access
  image_picker: ^1.0.4    # Pick images from gallery
  path_provider: ^2.1.1   # File system access
  provider: ^6.0.5        # State management
  
  # ADD THIS for image processing:
  image: ^4.1.4           # Image processing library
  
  # Image display
  cached_network_image: ^3.3.0
  
  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true